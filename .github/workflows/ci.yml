name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Test
        run: npm test
      - name: Deterministic eval
        run: npm run eval:deterministic
      - name: Compatibility gate
        run: npm run compatibility:refresh
      - name: Release gate
        run: npm run release:check
