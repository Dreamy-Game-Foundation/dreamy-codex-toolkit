name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Test
        run: npm test
      - name: Deterministic eval
        run: npm run eval:deterministic
      - name: Compatibility gate
        run: npm run compatibility:refresh
      - name: Release gate
        run: npm run release:check
      - name: npm pack smoke
        run: npm run pack:smoke
